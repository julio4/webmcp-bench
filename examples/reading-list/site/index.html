<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fieldnotes: practical essays about reliable agent systems">
  <title>Fieldnotes</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #25231f;
      --muted: #6d6961;
      --paper: #fbfaf6;
      --card: #fffefa;
      --line: #cbc7bd;
      --green: #315843;
      --gold: #704e13;
      --red: #8b342d;
      font-family: ui-serif, Georgia, Cambria, "Times New Roman", serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; background: var(--paper); color: var(--ink); }
    button, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    .site-header, .layout { width: min(1040px, calc(100% - 32px)); margin: auto; }
    .site-header { display: flex; align-items: center; gap: 22px; min-height: 78px; border-top: 3px double var(--ink); border-bottom: 1px solid var(--ink); }
    .brand { font-size: 24px; font-weight: 700; letter-spacing: .09em; text-decoration: none; text-transform: uppercase; }
    nav { margin-left: auto; display: flex; align-items: center; gap: 18px; }
    nav a { color: var(--muted); font: 650 12px/1.2 ui-sans-serif, system-ui, sans-serif; letter-spacing: .03em; text-decoration: none; }
    nav a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
    .dashboard-link { border-left: 1px solid var(--line); padding-left: 18px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 48px; padding: 46px 0 78px; }
    .content { min-width: 0; }
    .kicker { color: var(--green); font: 750 10px/1.2 ui-sans-serif, system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 13px 0; font-size: clamp(38px, 5vw, 58px); line-height: 1.04; letter-spacing: -.025em; }
    h2 { margin: 0; font-size: 25px; font-weight: 600; letter-spacing: -.012em; }
    .hero { padding: 18px 0 42px; border-bottom: 1px solid var(--line); }
    .deck { max-width: 670px; margin: 17px 0 0; color: var(--muted); font-size: 18px; line-height: 1.55; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 34px 0 0; padding-bottom: 12px; border-bottom: 2px solid var(--ink); }
    .section-head span { color: var(--muted); font: 12px/1.4 ui-sans-serif, system-ui, sans-serif; }
    .post-grid { display: block; }
    .post-card, .post-card.featured { min-height: 0; display: block; padding: 24px 0; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; color: inherit; text-decoration: none; }
    .post-card:hover h3 { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
    .post-card.featured .post-summary, .post-card.featured .post-meta { color: var(--muted); }
    .post-card.featured .post-type { color: var(--green); }
    .post-type { color: var(--green); font: 750 9px/1.2 ui-sans-serif, system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
    .post-card h3, .post-card:not(.featured) h3 { max-width: 650px; margin: 9px 0 8px; font-size: 27px; font-weight: 600; line-height: 1.12; letter-spacing: -.018em; }
    .post-card.featured h3 { font-size: 33px; }
    .post-summary { max-width: 650px; margin: 0 0 11px; color: var(--muted); font-size: 15px; line-height: 1.55; }
    .post-meta { color: var(--muted); font: 600 10px/1.2 ui-sans-serif, system-ui, sans-serif; }
    .back-link { display: inline-block; margin-bottom: 30px; color: var(--muted); font: 650 11px/1.2 ui-sans-serif, system-ui, sans-serif; text-decoration: none; }
    .back-link:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
    .article-header { padding: 6px 0 34px; border-bottom: 1px solid var(--ink); }
    .article-header h1 { max-width: 780px; }
    .meta { display: flex; gap: 0; flex-wrap: wrap; margin-top: 22px; color: var(--muted); font: 600 10px/1.2 ui-sans-serif, system-ui, sans-serif; }
    .tag { padding: 0; }
    .tag + .tag::before { content: "·"; padding: 0 8px; }
    .article-body { max-width: 720px; padding-top: 28px; font-size: 18px; line-height: 1.72; }
    .article-body p { margin: 0 0 24px; }
    .article-body h2 { margin: 43px 0 14px; font-size: 28px; }
    .article-body blockquote { margin: 32px 0; padding: 10px 0 10px 22px; border-left: 2px solid var(--ink); background: transparent; font-size: 20px; font-style: italic; }
    .diagram-frame { margin: 32px 0; padding: 18px 0 12px; overflow-x: auto; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; }
    .diagram { display: block; width: 100%; min-width: 650px; height: auto; }
    .diagram .edge { fill: none; stroke: #6d776f; stroke-width: 2.2; marker-end: url(#diagram-arrow); }
    .diagram .edge-label { fill: #465149; font: 700 12px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; paint-order: stroke; stroke: var(--paper); stroke-width: 7px; stroke-linejoin: round; }
    .diagram .node rect { fill: var(--paper); stroke: #7b857d; stroke-width: 1.5; rx: 2px; }
    .diagram .node.entry rect { stroke: var(--green); stroke-width: 2.2; }
    .diagram .node.terminal rect { fill: var(--ink); stroke: var(--ink); }
    .diagram .node-name { fill: var(--ink); font: 800 16px ui-sans-serif, system-ui, sans-serif; }
    .diagram .node-tool { fill: var(--muted); font: 11px ui-monospace, monospace; }
    .diagram .terminal text { fill: var(--paper); }
    figcaption { padding: 8px 0 2px; color: var(--muted); font: 10px/1.45 ui-sans-serif, system-ui, sans-serif; }
    .panel { position: sticky; top: 24px; align-self: start; border-top: 3px double var(--ink); border-bottom: 1px solid var(--line); background: transparent; }
    .reading-main { padding: 17px 0; }
    .row { display: flex; align-items: center; gap: 10px; }
    .row strong { font-size: 15px; font-weight: 600; }
    .state { margin-left: auto; padding: 0 0 2px; border-bottom: 1px solid var(--green); color: var(--green); font: 750 9px/1 ui-monospace, monospace; text-transform: uppercase; }
    .reading-items { display: grid; gap: 0; margin-top: 14px; }
    .reading-item, .empty-list { padding: 12px 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; }
    .reading-item strong, .empty-list strong { display: block; font: 750 13px/1.35 ui-sans-serif, system-ui, sans-serif; }
    .reading-item small, .empty-list span { display: block; margin-top: 6px; color: var(--muted); font: 11px/1.4 ui-sans-serif, system-ui, sans-serif; }
    .item-meta { display: flex; gap: 8px; margin-top: 9px; }
    .badge { padding: 0; color: var(--green); font: 750 9px/1 ui-sans-serif, system-ui, sans-serif; text-transform: uppercase; letter-spacing: .07em; }
    .badge.priority { color: var(--gold); }
    .tools { display: grid; gap: 8px; margin-top: 13px; }
    .tool { min-height: 44px; width: 100%; border: 1px solid var(--ink); border-radius: 0; padding: 10px 12px; background: var(--ink); color: var(--paper); text-align: left; font: 700 11px/1.25 ui-sans-serif, system-ui, sans-serif; }
    .tool:hover { background: transparent; color: var(--ink); }
    .tool[data-tool="remove_article"] { border-color: var(--line); background: transparent; color: var(--red); }
    .empty { color: var(--muted); font: 12px/1.5 ui-sans-serif, system-ui, sans-serif; }
    .notice { margin: 12px 0 0; padding: 7px 0 7px 10px; border-left: 2px solid var(--red); color: var(--red); font: 700 11px/1.4 ui-sans-serif, system-ui, sans-serif; }
    .notice:empty { display: none; }
    .debug { border-top: 1px solid var(--line); }
    .debug summary { display: flex; justify-content: space-between; gap: 10px; padding: 14px 0; color: var(--muted); cursor: pointer; font: 700 10px/1.2 ui-sans-serif, system-ui, sans-serif; letter-spacing: .04em; list-style: none; }
    .debug summary::-webkit-details-marker { display: none; }
    .debug summary::after { content: "+"; font-size: 15px; line-height: 10px; }
    .debug[open] summary::after { content: "−"; }
    .debug-body { border-top: 1px solid var(--line); }
    .debug-section { padding: 15px 0; border-bottom: 1px solid var(--line); }
    .debug-section:last-child { border-bottom: 0; }
    .status { margin: 8px 0 0; color: var(--muted); font: 11px/1.45 ui-sans-serif, system-ui, sans-serif; }
    .status.error { color: var(--red); }
    label { display: block; color: var(--muted); font: 750 10px/1.2 ui-sans-serif, system-ui, sans-serif; text-transform: uppercase; letter-spacing: .07em; }
    select { min-height: 42px; width: 100%; margin-top: 8px; border: 1px solid var(--line); border-radius: 0; padding: 9px; background: var(--card); color: var(--ink); }
    pre { margin: 12px 0 0; min-height: 78px; max-height: 180px; padding: 10px; overflow: auto; white-space: pre-wrap; word-break: break-word; background: #f1efe8; color: #465049; font: 10px/1.45 ui-monospace, monospace; }
    :focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } .panel { position: static; } }
    @media (max-width: 600px) { .site-header { align-items: start; padding: 18px 0; } nav { align-items: end; flex-direction: column; gap: 9px; } .dashboard-link { border: 0; padding: 0; } .layout { padding-top: 32px; gap: 38px; } .post-card.featured h3 { font-size: 29px; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#home">Fieldnotes</a>
    <nav aria-label="Primary navigation">
      <a href="#home">Home</a>
      <a href="#reading-list">Reading list</a>
      <a class="dashboard-link" href="/">Evaluation dashboard</a>
    </nav>
  </header>
  <main class="layout">
    <div class="content" id="content" aria-live="polite"></div>
    <aside class="panel" id="reading-list" aria-label="Reading list controls">
      <section class="reading-main">
        <div class="row"><strong>Reading list</strong><span class="state" id="state">loading</span></div>
        <div class="reading-items" id="reading-items"><div class="empty-list"><strong>Loading…</strong></div></div>
        <div class="tools" id="tools"><span class="empty">Loading available actions…</span></div>
        <p class="notice" id="notice" aria-live="polite"></p>
      </section>
      <details class="debug" id="debug">
        <summary>Debug menu</summary>
        <div class="debug-body">
          <section class="debug-section">
            <div class="row"><strong>Native WebMCP</strong></div>
            <p class="status" id="webmcp" aria-live="polite">Checking browser support…</p>
          </section>
          <section class="debug-section">
            <label for="fixture">Reset to fixture</label>
            <select id="fixture"></select>
            <pre id="evidence" aria-live="polite">Waiting for state…</pre>
          </section>
        </div>
      </details>
    </aside>
  </main>
  <script>
    const posts = [
      {
        slug: 'state-machines-for-agents',
        type: 'Featured · Agent systems',
        title: 'State Machines for Agents',
        summary: 'Make tool-using agents predictable by defining states, constraining transitions, and grading authoritative outcomes.',
        meta: '8 min read · August 29, 2026',
        featured: true,
      },
      {
        slug: 'tool-contracts-agents-can-trust',
        type: 'Tool design',
        title: 'Tool Contracts Agents Can Trust',
        summary: 'A useful tool contract says what can happen, what cannot happen, and how callers can prove the difference.',
        meta: '6 min read · August 24, 2026',
      },
      {
        slug: 'fixtures-before-prompts',
        type: 'Evaluation practice',
        title: 'Fixtures Before Prompts',
        summary: 'Stable starting conditions reveal more about an agent than another round of prompt tuning.',
        meta: '5 min read · August 17, 2026',
      },
      {
        slug: 'what-a-failed-eval-tells-you',
        type: 'Observability',
        title: 'What a Failed Evaluation Actually Tells You',
        summary: 'Separate semantic failure from broken infrastructure before deciding what to fix.',
        meta: '7 min read · August 10, 2026',
      },
    ];
    let project, snapshot, registrations;
    const $ = selector => document.querySelector(selector);
    const esc = value => String(value ?? '').replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));

    function diagram() {
      return `<figure class="diagram-frame">
        <svg class="diagram" viewBox="0 0 900 440" role="img" aria-labelledby="diagram-title diagram-description">
          <title id="diagram-title">Reading-list state machine</title>
          <desc id="diagram-description">Empty transitions to Saved by saving. Saved can transition to Prioritized, Empty, or Read. Prioritized transitions to Read.</desc>
          <defs><marker id="diagram-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d776f"/></marker></defs>
          <path class="edge" d="M 180 211 L 250 211"/><text class="edge-label" x="215" y="194">Save</text>
          <path class="edge" d="M 400 185 Q 440 118 480 91"/><text class="edge-label" x="435" y="124">Prioritize</text>
          <path class="edge" d="M 250 238 Q 145 365 105 252"/><text class="edge-label" x="158" y="325">Remove</text>
          <path class="edge" d="M 400 238 Q 550 366 710 238"/><text class="edge-label" x="553" y="329">Mark read</text>
          <path class="edge" d="M 630 91 Q 677 119 710 185"/><text class="edge-label" x="682" y="124">Mark read</text>
          <g class="node entry" transform="translate(30 170)"><rect width="150" height="82"/><text class="node-name" x="16" y="33">Empty</text><text class="node-tool" x="16" y="57">save_article</text></g>
          <g class="node" transform="translate(250 170)"><rect width="150" height="82"/><text class="node-name" x="16" y="33">Saved</text><text class="node-tool" x="16" y="57">3 available tools</text></g>
          <g class="node" transform="translate(480 50)"><rect width="150" height="82"/><text class="node-name" x="16" y="33">Prioritized</text><text class="node-tool" x="16" y="57">mark_read</text></g>
          <g class="node terminal" transform="translate(710 170)"><rect width="150" height="82"/><text class="node-name" x="16" y="33">Read</text><text class="node-tool" x="16" y="57">terminal · no tools</text></g>
        </svg>
        <figcaption>Five evaluated transitions connect four authoritative states. This is a static SVG—no Mermaid runtime required.</figcaption>
      </figure>`;
    }

    const articleBodies = {
      'state-machines-for-agents': `<p>An agent does not experience a product as a collection of pages. It experiences a changing set of possible actions. A state machine makes that hidden structure explicit: each state describes what is true now, and each transition names the action that is allowed to change it.</p>
        <p>That gives product behavior, WebMCP tools, fixtures, and evaluations one shared vocabulary. Instead of asking whether an agent “seemed to work,” we can ask whether it moved authoritative data from the declared source state to the declared target state without violating an invariant.</p>
        <blockquote>The graph is not a picture of the test suite. It is the behavioral contract the test suite must cover.</blockquote>
        <h2>The reading-list flow</h2>
        <p>This demo deliberately stays small. One featured article can be saved, prioritized, removed, or marked as read. Tool availability changes with the state, so an agent cannot prioritize an empty list or remove an article after it has been read.</p>
        ${diagram()}
        <h2>Evaluate every edge</h2>
        <p>Each edge starts from a deterministic fixture and runs in a fresh sandbox. The verifier grades downloaded authoritative state, while lifecycle events, command output, resource metrics, and cleanup status explain how the attempt reached its verdict.</p>
        <p>That separation matters. A bad goal interpretation is a semantic failure; a sandbox that never starts is infrastructure failure. Treating them as different outcomes makes the graph useful to both product and engineering teams.</p>`,
      'tool-contracts-agents-can-trust': `<p>A tool name and a JSON schema are only the outer shell of a contract. An agent also needs a narrow description of the intended effect, while the system needs explicit rules for forbidden side effects and postconditions.</p><p>Keep mutation tools small. Prefer one meaningful action over a flexible endpoint with several modes. The smaller contract is easier for an agent to select, easier for a user to approve, and much easier for an evaluator to grade.</p><h2>Describe the boundary</h2><p>Good contracts identify stable IDs, validate every input, and return concise evidence. They also make unavailable actions truly unavailable. Hiding an invalid tool is safer than exposing it and hoping the caller reads a warning.</p>`,
      'fixtures-before-prompts': `<p>When an evaluation begins from whatever data happens to exist, every failure becomes ambiguous. A canonical fixture removes that uncertainty by establishing the exact user, records, permissions, and application state required for one task.</p><p>Reset the fixture for every attempt. Then resolve the state independently before the agent starts. If setup says “Saved” but the resolver observes “Empty,” stop: that is fixture failure, not agent failure.</p><h2>Prompts come second</h2><p>Once the starting state is stable, prompt variations become meaningful experiments. Without that stability, prompt tuning mostly teaches the team to explain noise.</p>`,
      'what-a-failed-eval-tells-you': `<p>A red result is useful only when it points toward the right owner. Did the agent choose the wrong available tool? Did the application accept the call but violate a postcondition? Or did the sandbox fail before the task began?</p><p>Retain the goal, initial and final state, tool trace, verifier checks, infrastructure lifecycle, and exact versions together. That evidence turns a failed score into a reproducible explanation.</p><h2>Failure is part of the product</h2><p>An intentional baseline failure can be as valuable as a pass. It proves the evaluator distinguishes an agent limitation from a broken harness—and gives the next agent version a concrete behavior to improve.</p>`,
    };

    function renderHome() {
      document.title = 'Fieldnotes';
      $('#content').innerHTML = `<section class="hero"><div class="kicker">Fieldnotes on agent systems</div><h1>Build software agents can understand.</h1><p class="deck">Practical notes on state, tools, evaluation, and the evidence needed to make agent behavior trustworthy.</p></section>
        <section aria-labelledby="latest-title"><div class="section-head"><h2 id="latest-title">Latest posts</h2><span>Four short field guides</span></div><div class="post-grid">${posts.map(post => `<a class="post-card ${post.featured?'featured':''}" href="#post/${post.slug}"><span class="post-type">${esc(post.type)}</span><h3>${esc(post.title)}</h3><p class="post-summary">${esc(post.summary)}</p><span class="post-meta">${esc(post.meta)}</span></a>`).join('')}</div></section>`;
    }

    function renderPost(post) {
      document.title = `${post.title} · Fieldnotes`;
      $('#content').innerHTML = `<a class="back-link" href="#home">← All posts</a><article><header class="article-header"><div class="kicker">${esc(post.type)}</div><h1>${esc(post.title)}</h1><p class="deck">${esc(post.summary)}</p><div class="meta"><span class="tag">${esc(post.meta)}</span>${post.featured?'<span class="tag">WebMCP evaluation article</span>':'<span class="tag">Editorial example</span>'}</div></header><div class="article-body">${articleBodies[post.slug]}</div></article>`;
    }

    function renderContent() {
      const match = location.hash.match(/^#post\/(.+)$/);
      const post = match && posts.find(candidate => candidate.slug === decodeURIComponent(match[1]));
      if (post) renderPost(post); else renderHome();
    }

    async function request(url, options) {
      const response = await fetch(url, options);
      const body = await response.json();
      if (!response.ok) throw new Error(body.error || `Request failed: ${response.status}`);
      return body;
    }

    function showError(error) {
      $('#notice').textContent = error.message;
      $('#evidence').textContent = error.message;
    }

    function renderReadingList() {
      $('#state').textContent = snapshot.resolved_state;
      $('#evidence').textContent = JSON.stringify(snapshot.state, null, 2);
      const items = snapshot.state.items || [];
      $('#reading-items').innerHTML = items.length ? items.map(item => `<div class="reading-item"><strong>${esc(item.title)}</strong><small>${esc(item.id)}</small><div class="item-meta"><span class="badge">${esc(item.status)}</span>${item.priority?'<span class="badge priority">next priority</span>':''}</div></div>`).join('') : '<div class="empty-list"><strong>Nothing saved yet</strong><span>“State Machines for Agents” is the featured evaluation item.</span></div>';
      const tools = new Map(project.tools.map(tool => [tool.id, tool]));
      $('#tools').innerHTML = snapshot.tools.length
        ? snapshot.tools.map(id => { const label = id === 'save_article' ? 'Save “State Machines for Agents”' : tools.get(id).title; return `<button class="tool" type="button" data-tool="${esc(id)}">${esc(label)}</button>`; }).join('')
        : '<span class="empty">Terminal state — no actions are available.</span>';
      $('#tools').querySelectorAll('[data-tool]').forEach(button => button.addEventListener('click', () => invoke(button.dataset.tool, button.dataset.tool === 'save_article' ? {article_id: 'article-42'} : {}).catch(() => {})));
      if ($('#fixture').options.length) $('#fixture').value = snapshot.resolved_state;
    }

    async function invoke(name, input = {}, sync = true) {
      try {
        snapshot = await request(`/api/demo/tools/${encodeURIComponent(name)}`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(input)});
        $('#notice').textContent = '';
        renderReadingList();
        if (sync) await syncWebMCP();
        return snapshot;
      } catch (error) {
        showError(error);
        throw error;
      }
    }

    async function reset(state) {
      try {
        snapshot = await request('/api/demo/reset', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({state})});
        $('#notice').textContent = '';
        renderReadingList();
        await syncWebMCP();
        return snapshot;
      } catch (error) {
        showError(error);
        throw error;
      }
    }

    async function syncWebMCP() {
      registrations?.abort();
      registrations = undefined;
      const status = $('#webmcp');
      if (!window.isSecureContext || typeof document.modelContext?.registerTool !== 'function') {
        status.className = 'status';
        status.textContent = 'Unavailable in this browser. Manual controls still use the same tools and state.';
        return;
      }
      const controller = new AbortController();
      registrations = controller;
      const definitions = new Map(project.tools.map(tool => [tool.id, tool]));
      try {
        await Promise.all(snapshot.tools.map(id => {
          const definition = definitions.get(id);
          return document.modelContext.registerTool({
            name: definition.id,
            title: definition.title,
            description: definition.description,
            inputSchema: definition.input_schema,
            annotations: {readOnlyHint: !definition.mutates},
            async execute(input = {}) {
              const next = await invoke(definition.id, input, false);
              await syncWebMCP();
              return next;
            },
          }, {signal: controller.signal});
        }));
        if (controller.signal.aborted) return;
        const discovered = await document.modelContext.getTools();
        const active = discovered.map(tool => tool.name).filter(name => snapshot.tools.includes(name));
        status.className = 'status';
        status.textContent = active.length ? `Registered and discoverable: ${active.join(', ')}` : 'Active. No tools are exposed in this terminal state.';
      } catch (error) {
        if (!controller.signal.aborted) {
          status.className = 'status error';
          status.textContent = `Registration failed: ${error.message}`;
        }
      }
    }

    async function start() {
      [project, snapshot] = await Promise.all([request('/api/project'), request('/api/demo/state')]);
      $('#fixture').innerHTML = project.states.map(state => `<option value="${esc(state.id)}">${esc(state.name)}</option>`).join('');
      $('#fixture').addEventListener('change', event => reset(event.target.value).catch(() => {}));
      renderReadingList();
      await syncWebMCP();
      window.__statelabDemo = {invoke, reset, get state() { return snapshot; }};
    }

    window.addEventListener('hashchange', renderContent);
    renderContent();
    start().catch(showError);
  </script>
</body>
</html>
